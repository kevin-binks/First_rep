<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exeter IT | Professional IT Services</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- Professional baseline styling -->
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            color: #1B2A4A;
            background: #F5F2EE;
            line-height: 1.6;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 40px;
            background: white;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            display: flex;
            align-items: center;
        }

        header svg {
            height: 80px; /* Reduced from 420px → professional scale */
            width: auto;
        }

        nav a {
            margin-left: 25px;
            text-decoration: none;
            font-weight: 600;
            color: #1B2A4A;
            transition: 0.2s;
        }

        nav a:hover {
            color: #D4872A;
        }

        .hero {
            text-align: center;
            padding: 120px 40px;
            background: linear-gradient(to bottom, #ffffff, #f0ece7);
        }

        .hero h2 {
            font-size: 2.4rem;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #444;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            background: #1B2A4A;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn:hover {
            background: #D4872A;
        }

        footer {
            text-align: center;
            padding: 30px;
            font-size: 0.9rem;
            color: #555;
        }
    </style>
</head>
